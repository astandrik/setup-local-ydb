name: Count action users

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Generate action users badge endpoint
        run: node .github/scripts/count-action-users.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated badge
        run: |
          if git diff --quiet -- docs/endpoints/setup-local-ydb.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/endpoints/setup-local-ydb.json
          git commit -m "Update action users badge" -- docs/endpoints/setup-local-ydb.json
          git push
